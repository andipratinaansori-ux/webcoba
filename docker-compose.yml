version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qualita-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin_qualita_password}
      # Database environment variables (opsional, jika ingin koneksi ke MySQL service)
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-}
      - DB_PASS=${DB_PASS:-}
      - DB_NAME=${DB_NAME:-}
    volumes:
      # Persistent storage agar file upload tidak hilang saat restart/rebuild
      - qualita_uploads:/app/public/uploads

volumes:
  qualita_uploads:
    name: qualita_uploads_volume
